spring:
  application:
    name: bootcamp-framework-microservice
  threads:
    virtual:
      enabled: true
  config:
    import:
      - optional:nacos:${spring.application.name}.yml?group=BOOTCAMP&refreshEnabled=true
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        namespace: bootcamp-dev
        service: ${spring.application.name}
        group: BOOTCAMP
      config:
        namespace: bootcamp-dev
        group: BOOTCAMP
        file-extension: yml
    loadbalancer:
      nacos:
        enabled: true
    openfeign:
      circuitbreaker:
        enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
          jwk-set-uri: http://localhost:9000/oauth2/jwks

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus,metrics,traces"
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  metrics:
    tags:
      application: ${spring.application.name}

feign:
  sentinel:
    enabled: true

rocketmq:
  name-server: 127.0.0.1:9876
  producer:
    group: ${spring.application.name}
    customized-trace-topic: bootcamp-producer
    send-message-timeout: 10000
