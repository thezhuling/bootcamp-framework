# Three-node Kafka for replication experiments: ISR, min.insync.replicas, acks=all, leader
# failover, unclean election, partition reassignment.
#
#   docker compose -f docker-compose.cluster.yml up -d --wait
#   ./init-kafka.sh               # detects this stack and creates topics with 3 replicas
#
# Publishes the same host ports as docker-compose.yml (9092, 8895), so stop that stack first.
# Every node is broker + controller; the controller quorum is the three of them.
#
# Clients bootstrap on 127.0.0.1:9092 and are then sent to whichever node leads a partition:
# 127.0.0.1:9092 / 9093 / 9094 for kafka-1 / 2 / 3.
name: bootcamp-kafka-cluster

x-kafka-env: &kafka-env
  CLUSTER_ID: DuKY_5eDTg6gZsUdWYycJQ
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  # Production-shaped durability: three copies, and a write with acks=all needs two of them.
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000
  # 3 x 384 MB keeps the stack near 1.8 GB next to Nacos and RocketMQ in the Docker Desktop VM.
  KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
  TZ: Asia/Shanghai

x-kafka: &kafka
  image: apache/kafka:4.3.1
  healthcheck:
    test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:19092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 20s
    start_period: 30s
    retries: 12
  restart: unless-stopped

services:
  kafka-1:
    <<: *kafka
    container_name: bootcamp-kafka-1
    hostname: kafka-1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:19092,HOST://127.0.0.1:9092
    ports:
      - "9092:9092"
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    <<: *kafka
    container_name: bootcamp-kafka-2
    hostname: kafka-2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,HOST://127.0.0.1:9093
    ports:
      - "9093:9092"
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *kafka
    container_name: bootcamp-kafka-3
    hostname: kafka-3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:19092,HOST://127.0.0.1:9094
    ports:
      - "9094:9092"
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: bootcamp-kafka-cluster-ui
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: bootcamp-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:19092,kafka-2:19092,kafka-3:19092
      JAVA_OPTS: -Xms128m -Xmx256m
      TZ: Asia/Shanghai
    ports:
      - "8895:8080"
    restart: unless-stopped

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
