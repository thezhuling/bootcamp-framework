# Single-master broker for local development (mounted over the image's conf/broker.conf).
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
deleteWhen=04
fileReservedTime=48

namesrvAddr=namesrv:9876
# Address the broker registers with the nameserver. Clients connect to whatever is advertised,
# and the services run on the host, so this must be the host-visible address (published 10911).
brokerIP1=127.0.0.1
listenPort=10911

storePathRootDir=/home/rocketmq/store

# Dev conveniences: unknown topics / consumer groups are created on first use.
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true

# The store lives on the Docker Desktop VM disk; the 75 % default makes the broker refuse sends
# ("service not available now") once that disk fills up with unrelated images.
diskMaxUsedSpaceRatio=90
