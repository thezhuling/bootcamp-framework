server:
  port: 8080

spring:
  application:
    name: bootcamp-framework-gateway
  threads:
    virtual:
      enabled: true
  # Sentinel and Resilience4j both ship a ReactiveCircuitBreakerFactory. Sentinel's registers
  # first, Resilience4j's backs off on @ConditionalOnMissingBean, and the gateway's
  # .circuitBreaker() filter — which asks for ReactiveResilience4JCircuitBreakerFactory
  # specifically — is then never registered, so the RouteLocator bean fails.
  # Sentinel stays on for flow control and the dashboard; only its circuit breaker steps aside.
  autoconfigure:
    exclude:
      - com.alibaba.cloud.circuitbreaker.sentinel.ReactiveSentinelCircuitBreakerAutoConfiguration
      - com.alibaba.cloud.circuitbreaker.sentinel.SentinelCircuitBreakerAutoConfiguration
  config:
    import:
      - optional:nacos:bootcamp-framework-gateway.yml?group=BOOTCAMP&refreshEnabled=true
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      discovery:
        namespace: <gateway-nacos-namespace-uuid>
        group: BOOTCAMP
      config:
        namespace: <gateway-nacos-namespace-uuid>
        group: BOOTCAMP
        file-extension: yml
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
          jwk-set-uri: http://localhost:9000/oauth2/jwks

management:
  endpoint:
    shutdown:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "health,info,shutdown,prometheus,metrics,gateway"
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  metrics:
    tags:
      application: ${spring.application.name}

bootcamp:
  gateway:
    circuit-breaker:
      # Time limit for calls behind a route's .circuitBreaker() filter (see
      # GatewayCircuitBreakerConfig). Resilience4j's own default is 1s, which sends slower but
      # healthy downstream calls to /fallback. Set it above the slowest route's real P99 latency.
      # Read at startup; overriding it from Nacos needs a restart.
      timeout: 5s
